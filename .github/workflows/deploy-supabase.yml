name: Deploy Supabase

# Applies database migrations and deploys the Edge Functions to the Supabase project
# whenever backend code changes on main. Can also be run by hand from the Actions tab.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   the project's database password
#   SUPABASE_PROJECT_ID    the project ref
# OpenAI secrets are NOT stored here; they live in Supabase (supabase secrets set ...).

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check secrets are set
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::warning::Supabase secrets are not set yet, so nothing was deployed. Add them, then re-run this workflow."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == 'true'
        with:
          version: latest

      - name: Link project
        if: steps.check.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Apply database migrations
        if: steps.check.outputs.ready == 'true'
        run: supabase db push

      - name: Deploy Edge Functions
        if: steps.check.outputs.ready == 'true'
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
