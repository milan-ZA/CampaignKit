<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampaignKit</title>
    <meta name="description" content="One brief in. One marketing plan out. Week-by-week marketing plans for small businesses, in your own brand style." />
    <meta name="theme-color" content="#1E293B" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      ;(function () {
        var saved = null
        try { saved = localStorage.getItem('ck-theme') } catch (e) {}
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
